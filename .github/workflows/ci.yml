name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: becreative
          POSTGRES_PASSWORD: becreative
          POSTGRES_DB: becreative
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U becreative -d becreative"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://becreative:becreative@localhost:5432/becreative
      BETTER_AUTH_SECRET: ci-only-becreative-secret-change-me-please-32b
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_NAME: BeCreative
      REQUIRE_EMAIL_VERIFICATION: "false"
      EMAIL_PROVIDER: console
      STORAGE_PROVIDER: local
      GEOCODER_PROVIDER: local
      NEXT_PUBLIC_MAP_PROVIDER: leaflet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx drizzle-kit migrate
      - run: npm run build
